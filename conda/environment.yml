name: pyratp
channels:
  - openalea3
  - conda-forge
dependencies:
# list here manually conda-only deps (listed in [tool.conda.environment] section of pyproject)
  - python
  - pip
  - meson-python
  - openalea.plantgl
  - openalea.mtg
  - qtpy
  # C and Fortran compilers of conda-forge: gcc/gfortran (linux), clang/gfortran (macos),
  # MSVC/flang (windows: needs Visual Studio 2022 or its Build Tools, C++ workload)
  - c-compiler
  - fortran-compiler
  
  # let pip install the rest using pyproject.toml (if you are okay with conda/pip mix)
  - pip:
      - ..[doc, test]
